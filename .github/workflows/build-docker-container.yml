name: Build Docker Container
on:
  workflow_run:
    workflows: ["Build Docker Image"]
    types: completed
jobs:
  build_container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to working directory
        uses: actions/checkout@v4
      - name: Reference previous workflow Build Docker Image
        uses: ./.github/workflows/build-docker-image.yml
        id: workflow_variable
      - name: Build container from image
        run: docker run --name metadata-cleaner-container -d ${{ steps.workflow_variable.outputs.docker_image }}
